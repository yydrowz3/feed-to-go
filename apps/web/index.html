<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" sizes="32x32" />
    <script id="theme-init">
      (() => {
        let theme;
        try {
          theme = window.localStorage.getItem("feed-to-go.theme");
        } catch {
          /* Storage may be disabled. */
        }
        if (theme !== "light" && theme !== "dark") {
          theme = "light";
          try {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          } catch {
            /* Use light when the system preference is unavailable. */
          }
        }
        document.documentElement.dataset.theme = theme === "dark" ? "night" : "light";
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Feed to Go</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
